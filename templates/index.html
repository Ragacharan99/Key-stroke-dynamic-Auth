<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biometric Keystroke Dynamics System</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>
    <div class="bg-glow-1"></div>
    <div class="bg-glow-2"></div>

    <div class="app-container">
        <h1>Keystroke Auth <span style="font-weight:300; opacity:0.6;">System</span></h1>

        <div class="controls-grid">
            <div class="input-block">
                <label for="username">Identity Core</label>
                <input type="text" id="username" placeholder="Enter designated ID...">
            </div>
            <div class="input-block">
                <label for="mode">Operation Mode</label>
                <select id="mode">
                    <option value="train">Training [10 samples req]</option>
                    <option value="auth">Authentication [Verify Rhythm]</option>
                </select>
            </div>
        </div>

        <div class="target-panel">
            <span>Translate the sequence below:</span>
            <code>The quick brown fox jumps over the lazy dog.</code>
        </div>

        <div class="typing-area-wrapper">
            <textarea id="typingArea" placeholder="Initiate keystroke sequence here..." spellcheck="false"
                autocomplete="off"></textarea>
            <canvas id="rhythmVisualizer" width="800" height="40"></canvas>
        </div>

        <div class="action-area">
            <button id="submitBtn" onclick="processBiometrics()">Process Biometrics</button>
            <div class="progress-ring-container" id="progressContainer">
                <div class="progress-ring">
                    <svg width="60" height="60">
                        <circle class="ring-bg" cx="30" cy="30" r="24"></circle>
                        <circle class="ring-fill" cx="30" cy="30" r="24" id="ringFill"></circle>
                    </svg>
                </div>
                <div class="progress-info">
                    <span class="progress-label">Enrollment</span>
                    <span class="progress-value" id="sampleCountDisplay">0 / 10</span>
                </div>
            </div>
        </div>

        <div id="resultBox"></div>
    </div>

    <script src="/static/script.js"></script>
</body>

</html>
